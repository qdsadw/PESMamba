# general settings
name: PESMamba_X4
model_type: SRModel
scale: 4
num_gpu: auto
manual_seed: 10

datasets:
  test_1:  # the 1st test dataset
    name: AID_test
    type: PairedImageDataset
    dataroot_gt: /AID/test/HR
    dataroot_lq: /AID/test/LR/x4
    filename_tmpl: '{}_x4'
    io_backend:
      type: disk

  test_2:  # the 2nd test dataset
    name: UCMerced
    type: PairedImageDataset
    dataroot_gt: /UCMerced_LandUse/UCMerced_LandUse/test/HR
    dataroot_lq: /UCMerced_LandUse/UCMerced_LandUse/test/LR/x4
    filename_tmpl: '{}_x4'
    io_backend:
      type: disk
