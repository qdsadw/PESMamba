network_g:
  type: PESMamba
  scale: 4
  in_chans: 3
  img_range: 1.
  num_layers: 8
  embedding_dim: 48
  d_state: 16
  K_list: [4, 4, 4, 4, 4, 4, 4, 4]
# path
path:
  pretrain_network_g: /home/waas/MambaIR-main/experiments/PESMamba_X4/models/net_g_latest.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
